services:
  django:
    build: ./server
    depends_on:
      - redis
      - db
    expose:
      - "8000"
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  db:
    image: postgres:17-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env
  
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - django
    ports:
      - "80:80"
    env_file:
    - .env



volumes:
  db-data: