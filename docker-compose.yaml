services:
  django:
    build: ./server
    depends_on:
      - redis
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  db:
    image: postgres:17-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env


volumes:
  db-data: